<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="HygiQ: a live food-safety trust layer for kitchens, customers, homes and regulators, with a multimodal, voice-enabled AI assistant and live maps.">
<meta name="theme-color" content="#1F5C4A">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>HygiQ — Trust on every plate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: app shell. Left rail on desktop, scrollable bottom tab bar on phones, assistant as a slide-in panel, demo bar docked at the bottom. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --surface-2:#E9EEE7; --ink:#14201B; --muted:#5A6A61; --line:#D5DDD3;
  --brand:#1F5C4A; --on-brand:#FFFFFF; --brand-soft:#DCEBE4;
  --accent:#E3A021; --accent-ink:#8A5300; --accent-soft:#FBEFD6;
  --ok:#2D7A4E; --ok-soft:#DDF0E3; --warn:#A8690E; --warn-soft:#FBEBCF; --bad:#BE3B27; --bad-soft:#F8DED8;
  --shadow:0 1px 2px rgba(20,32,27,.06),0 8px 24px rgba(20,32,27,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#16201B; --surface-2:#1E2A24; --ink:#E6EEE9; --muted:#97A89E; --line:#2A3832;
  --brand:#62BC98; --on-brand:#0B1410; --brand-soft:#1C3229;
  --accent:#F0AE45; --accent-ink:#F4BE65; --accent-soft:#3A2C12;
  --ok:#5CC488; --ok-soft:#173226; --warn:#E6A84A; --warn-soft:#3A2B12; --bad:#F07762; --bad-soft:#3D1D17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201B; --surface-2:#1E2A24; --ink:#E6EEE9; --muted:#97A89E; --line:#2A3832;
  --brand:#62BC98; --on-brand:#0B1410; --brand-soft:#1C3229;
  --accent:#F0AE45; --accent-ink:#F4BE65; --accent-soft:#3A2C12;
  --ok:#5CC488; --ok-soft:#173226; --warn:#E6A84A; --warn-soft:#3A2B12; --bad:#F07762; --bad-soft:#3D1D17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
[hidden]{display:none!important}
img{max-width:100%}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.85em}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}

.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand b{font-family:var(--f-display);font-size:1.2rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand small{display:block;font-size:.72rem;color:var(--muted);font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:10px;text-align:left;font-weight:600;color:var(--muted)}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;font-size:.72rem;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
.rail-foot{margin-top:auto;display:grid;gap:8px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topbar .mob-brand{display:none}
.roles{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;max-width:100%}
.roles button{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:600;font-size:.88rem;color:var(--muted);white-space:nowrap}
.roles button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.ai-pill{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.ai-pill[data-s="live"] .dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.ai-pill[data-s="demo"] .dot{background:var(--accent)}
.content{padding-block:24px 140px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1180px;width:100%;display:grid;gap:20px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pagehead p{color:var(--muted);margin-top:4px;max-width:62ch}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:wait}
.btn svg{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;line-height:1.6}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.pill.accent{background:var(--accent-soft);color:var(--accent-ink)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0;flex-wrap:wrap}
.row:first-child{border-top:0;padding-top:2px}
.row .grow{flex:1;min-width:140px}
.row .t{font-weight:600}
.row .s{font-size:.82rem;color:var(--muted)}
.stripe{width:4px;align-self:stretch;border-radius:4px;background:var(--line);flex:none}
.stripe.bad{background:var(--bad)}.stripe.warn{background:var(--warn)}.stripe.ok{background:var(--ok)}
.stat b{display:block;font-family:var(--f-display);font-size:1.9rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:.9rem}
input[type=text],input[type=date],input[type=number],input[type=time],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
.field{display:grid;gap:5px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:99px;font-size:.84rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.chip.f[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center;background:var(--surface-2);min-width:0;cursor:pointer}
.drop img{width:86px;height:86px;object-fit:cover;border-radius:10px;flex:none}
.drop .ph{width:86px;height:86px;border-radius:10px;background:var(--surface);display:grid;place-items:center;color:var(--muted);flex:none}
.drop .ph svg{width:28px;height:28px}
.result{border-radius:12px;padding:14px;background:var(--surface-2);display:grid;gap:8px;font-size:.92rem}
.result ul{margin:0;padding-left:18px}
.demo-tag{font-size:.72rem;color:var(--accent-ink);font-weight:700}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--surface-2)}
.check{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface);padding:0}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:15px;height:15px}
.spark{width:100%;height:56px;display:block}
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.ring text{font-family:var(--f-display);font-weight:800;fill:var(--ink)}
.ring .arc{transition:stroke-dasharray .6s ease}
.alert{display:flex;gap:12px;padding:14px;border-radius:14px;background:var(--bad-soft);color:var(--ink);align-items:flex-start;flex-wrap:wrap}
.alert.warn{background:var(--warn-soft)}
.alert.okb{background:var(--ok-soft)}
.alert svg{width:20px;height:20px;flex:none;color:var(--bad);margin-top:2px}
.alert.warn svg{color:var(--warn)}
.alert.okb svg{color:var(--ok)}
.time{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);width:52px;flex:none}
.md p{margin:0 0 6px}.md ul{margin:0 0 6px;padding-left:18px}.md li{margin:2px 0}
.map-wrap{overflow-x:auto}
.map{width:100%;min-width:520px;height:auto;display:block}
.map text{font-family:var(--f-body);font-size:12px;fill:var(--ink);font-weight:600}
.map .sub{font-size:10.5px;fill:var(--muted);font-weight:500}
.map .area{cursor:pointer}
.map .area:hover circle.halo{opacity:.35}
.qr{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;width:78px;flex:none}
.qr i{aspect-ratio:1;background:var(--ink);border-radius:1px}
.qr i.o{background:transparent}
.bar{height:6px;background:var(--surface-2);border-radius:6px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;transition:width .6s ease}
.breakdown{display:grid;gap:10px}
.breakdown .why{font-size:.78rem;color:var(--muted)}
.shot{position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2);max-width:100%}
.shot img,.shot canvas{display:block;width:100%;height:auto}
.vbox{position:absolute;border:2.5px solid var(--bad);border-radius:6px;box-shadow:0 0 0 2px rgba(0,0,0,.18)}
.vbox span{position:absolute;top:-1px;left:-1px;background:var(--bad);color:#fff;font:700 11px/1 var(--f-mono);padding:3px 5px;border-radius:5px 0 5px 0}
.vbox.medium{border-color:var(--warn)}.vbox.medium span{background:var(--warn)}
.vbox.low{border-color:var(--accent)}.vbox.low span{background:var(--accent);color:#000}
.vbox.fixed{border-color:var(--ok);border-style:dashed;opacity:.6}.vbox.fixed span{background:var(--ok)}
.scan{position:absolute;left:0;right:0;height:3px;background:var(--accent);box-shadow:0 0 18px 4px var(--accent);animation:scan 1.4s ease-in-out infinite alternate}
@keyframes scan{from{top:4%}to{top:94%}}
.medals{display:flex;gap:6px;flex-wrap:wrap}
.medal{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);flex:none}
.medal.off{background:var(--surface-2);color:var(--line)}
.medal svg{width:16px;height:16px}
.quiz-opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:600;margin-top:8px}
.quiz-opt:hover{border-color:var(--brand)}
.quiz-opt.right{border-color:var(--ok);background:var(--ok-soft)}
.quiz-opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tl .row{align-items:flex-start}
.tl .ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted)}
.tl .ico svg{width:15px;height:15px}
.tl .ico.bad{background:var(--bad-soft);color:var(--bad)}.tl .ico.ok{background:var(--ok-soft);color:var(--ok)}.tl .ico.warn{background:var(--warn-soft);color:var(--warn)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:520px}
.tbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.demo-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;width:min(760px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;display:grid;gap:8px;box-shadow:0 14px 40px rgba(0,0,0,.3)}
.demo-steps{display:flex;gap:6px;overflow-x:auto}
.demo-steps span{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--bg) 14%,transparent);white-space:nowrap;opacity:.6}
.demo-steps span.on{background:var(--accent);color:#1b1205;opacity:1}
.demo-steps span.done{opacity:.9}
.demo-bar .cap{font-size:.92rem;display:flex;gap:10px;align-items:center;justify-content:space-between}
.demo-bar .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}

.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:8px;background:var(--brand);color:var(--on-brand);border:0;border-radius:99px;padding:12px 18px 12px 14px;font-weight:700;box-shadow:0 10px 30px rgba(20,60,45,.3)}
.fab svg{width:22px;height:22px}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:50;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.12);transform:translateX(105%);transition:transform .25s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.panel.open{transform:none}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h select{width:auto;padding:5px 8px;font-size:.84rem}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:.92rem;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--brand);color:var(--on-brand);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg img{max-width:160px;border-radius:8px;display:block;margin-bottom:6px}
.suggest{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.suggest button{font-size:.8rem;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 10px;text-align:left}
.composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);align-items:flex-end}
.composer textarea{min-height:42px;max-height:120px;flex:1}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;cursor:pointer}
.icon-btn svg{width:18px;height:18px}
.icon-btn.rec{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.2s ease-in-out infinite}
.icon-btn[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.voice-hint{padding:0 16px 8px;font-size:.8rem;color:var(--muted)}
.attach-prev{padding:0 16px 8px;display:flex;gap:8px;align-items:center;font-size:.82rem}
.attach-prev img{width:40px;height:40px;object-fit:cover;border-radius:6px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:48}

.bottom-nav{display:none}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .topbar .mob-brand{display:flex}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));overflow-x:auto;gap:2px}
  .bottom-nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:600;color:var(--muted);padding:4px 6px;flex:1 0 64px;min-width:64px}
  .bottom-nav button span{white-space:nowrap}
  .bottom-nav .count{display:none}
  .bottom-nav button[aria-current="page"]{color:var(--brand)}
  .bottom-nav svg{width:22px;height:22px}
  .fab{bottom:calc(76px + env(safe-area-inset-bottom,0px));padding:13px}
  .fab .fab-l{display:none}
  .demo-bar{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:1fr}
  .g2.wide{grid-template-columns:1fr}
}
@media (max-width:640px){
  .g2{grid-template-columns:1fr}
  .topbar,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hero{grid-template-columns:1fr;justify-items:start}
  h1{font-size:1.45rem}
  .drop{flex-direction:column;align-items:flex-start}
  .top-r{margin-left:0}
}

.lf-river{stroke:var(--brand);stroke-opacity:.28}

<div class="app">
  <aside class="rail">
    <div class="brand"><span id="logo1"></span><div><b>HygiQ</b><small>Trust on every plate</small></div></div>

    <div class="rail-foot">
      <button class="btn" data-act="demo">Play demo</button>
      <button class="btn ghost sm" data-act="reset">Reset sample data</button>
      <p class="small muted" style="padding:0 6px">Sample data for the TechForFood demo. AI runs live when Claude is connected.</p>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="brand mob-brand"><span id="logo2"></span><b style="font-size:1.05rem">HygiQ</b></div>
      <div class="roles" id="roles" role="group" aria-label="Who is using the app"></div>
      <div class="top-r"><div class="ai-pill" id="aiPill" data-s="wait"><span class="dot"></span><span id="aiTxt">Connecting AI…</span></div><button class="btn sm" data-act="demo" id="demoTop"></button></div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<button class="fab" id="fab" aria-label="Ask HygiQ AI"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9 11h.01M12 11h.01M15 11h.01"/></svg><span class="fab-l">Ask HygiQ AI</span></button>
<div class="scrim" id="scrim" hidden></div>
<aside class="panel" id="panel" aria-label="HygiQ assistant">
  <div class="panel-h">
    <span id="logo3"></span>
    <div style="flex:1;min-width:0"><h3>HygiQ AI</h3><p class="small muted" id="panelSub">AI food-safety assistant</p></div>
    <button class="icon-btn" id="speakBtn" type="button" aria-pressed="false" aria-label="Read replies aloud" title="Read replies aloud"></button>
    <select id="lang" aria-label="Reply language"><option>English</option><option value="Hindi">हिंदी</option><option value="Marathi">मराठी</option></select>
    <button class="icon-btn" id="closePanel" aria-label="Close assistant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <div class="suggest" id="suggest"></div>
  <div class="voice-hint" id="voiceHint" hidden></div>

  </form>
</aside>

/* Explainable score: checklist 25 · temperatures 30 · stock 15 · training 15 · AI checks 15 */
function breakdown(){
 const d=due();const doneN=d.filter(t=>t.done).length;const checklist=25*(d.length?doneN/d.length:1);
 const okS=S.sensors.filter(inRange);const temps=30*okS.length/S.sensors.length;
 const expired=S.inventory.filter(i=>daysLeft(i.expiry)<0);const stock=Math.max(0,15-expired.length*6);
 const b=S.staff.reduce((a,s)=>a+s.badges.length,0),bMax=S.staff.length*QUIZZES.length;const training=15*b/bMax;
 const last=S.aiChecks[0];const unfixed=last?last.issues.filter(i=>!i.fixed):[];const ai=Math.max(0,15-unfixed.length*5);
 return[
  {k:'Hygiene checklist',v:checklist,max:25,why:d.length?`${doneN} of ${d.length} checks due so far are done`:'No checks due yet today'},
  {k:'Temperatures',v:temps,max:30,why:okS.length===S.sensors.length?'All 4 units in safe range':S.sensors.filter(s=>!inRange(s)).map(s=>`${s.name} at ${cur(s)}°C`).join(', ')+' out of range'},
  {k:'Stock in date',v:stock,max:15,why:expired.length?`${expired.map(i=>i.name).join(', ')} expired (−6 each)`:'Nothing past its expiry date'},
  {k:'Staff training',v:training,max:15,why:`${b} of ${bMax} training badges earned`},
  {k:'AI photo checks',v:ai,max:15,why:unfixed.length?`${unfixed.length} unfixed issue${unfixed.length>1?'s':''} from the last photo check (−5 each)`:'Last photo check: no open issues'}];
}
const score=()=>Math.round(Math.min(100,breakdown().reduce((a,x)=>a+x.v,0)));
const grade=n=>n>=85?['A','Excellent','ok']:n>=70?['B','Good','ok']:n>=55?['C','Needs work','warn']:['D','Poor','bad'];

function risk(o){const sc=outletScore(o);const c=S.complaints.filter(x=>x.place===o.name&&x.status!=='resolved');const hi=c.filter(x=>x.sev==='high').length;
 let r=(100-sc)*.6+hi*15+(c.length-hi)*5;if(o.live)r+=S.sensors.filter(s=>!inRange(s)).length*5+S.inventory.filter(i=>daysLeft(i.expiry)<0).length*5;
 r=Math.min(100,Math.round(r));return{r,level:r>=60?'High':r>=35?'Medium':'Low',tone:r>=60?'bad':r>=35?'warn':'ok',open:c.length,hi}}

 Object.entries(byArea).forEach(([a,l])=>{if(l.length>=3&&new Set(l.map(c=>c.place)).size>=2)out.push({title:`Area cluster in ${a}`,body:`${l.length} serious reports across different kitchens in 72 h.`})});

function spark(s){const h=s.hist,r=RANGES[s.type],w=220,ht=56;const lo=Math.min(...h,r.min===-25?-21:r.min)-1,hi=Math.max(...h,r.max===85?73:r.max)+1;const lim=s.type==='hot'?r.min:r.max;
 const x=i=>i/(h.length-1)*w,y=v=>ht-4-(v-lo)/(hi-lo)*(ht-8);const pts=h.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');const tone=inRange(s)?'ok':'bad';
 return `<svg class="spark" viewBox="0 0 ${w} ${ht}" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${w}" y1="${y(lim)}" y2="${y(lim)}" stroke="var(--bad)" stroke-dasharray="3 3" stroke-width="1" vector-effect="non-scaling-stroke"/><polygon points="0,${ht} ${pts} ${w},${ht}" fill="var(--${tone})" opacity=".12"/><polyline points="${pts}" fill="none" stroke="var(--${tone})" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${x(h.length-1)}" cy="${y(h[h.length-1])}" r="3.5" fill="var(--${tone})"/></svg>`}

function recallImpact(item){const outs=S.outlets.filter(o=>!o.live&&o.sup.includes(item.supplier));const days=Math.max(1,-daysLeft(item.arrived||iso(-1)));return{outlets:outs,customers:35*days+outs.length*60}}

 box.innerHTML=`<div class="card" style="border-color:var(--bad)"><div class="card-h"><h3>Recall ${esc(i.name)} · <span class="mono">${esc(i.batch)}</span></h3><button class="btn sm ghost" data-act="recallCancel">Cancel</button></div>
  <p class="small">Before you confirm, this is who will be notified:</p>

  ${imp.outlets.length?`<p class="small muted">${imp.outlets.map(o=>esc(o.name)).join(', ')}</p>`:''}

 box.scrollIntoView({behavior:'smooth',block:'center'})}

 if(Q.step===-1)return `<div class="card" style="border-color:var(--brand)"><div class="card-h"><h3>${q.title} quiz</h3><button class="btn sm ghost" data-act="quizClose">Close</button></div><div class="field"><label class="label" for="qzStaff">Who is taking the quiz?</label>${staffSelect('qzStaff')}</div><button class="btn primary" data-act="quizBegin" style="align-self:flex-start">Begin</button></div>`;

 ${S.exploreMode==='map'?`<div class="card" style="gap:10px"><div class="mapwrap"><div id="exMap" class="mapbox" role="application" aria-label="Map of outlets by hygiene score"></div></div><div class="legend"><span><i style="background:var(--ok)"></i>Score 70+</span><span><i style="background:var(--warn)"></i>55–69</span><span><i style="background:var(--bad)"></i>Below 55</span><span><i style="background:var(--accent)"></i>Live logs</span>${S.me?'<span><i style="background:#2F6FE4"></i>You</span>':''}</div></div>`:''}
 <div class="card"><div class="list" id="exList">${exploreList()}</div></div>`;
function exploreList(){const q=S.exploreQ.toLowerCase();return S.outlets.filter(o=>(!S.exploreVeg||o.veg)&&(!q||(o.name+' '+o.area+' '+o.type).toLowerCase().includes(q))).sort((a,b)=>S.exploreSort==='dist'?distKm(a)-distKm(b):outletScore(b)-outletScore(a)).map(o=>{const sc=outletScore(o);const[g,,tone]=grade(sc);const open=S.complaints.filter(c=>c.place===o.name&&c.status!=='resolved').length;const insp=S.inspections.filter(i=>i.outlet===o.name&&i.status==='done').sort((a,b)=>b.date.localeCompare(a.date))[0];const exp=S.selOutlet===o.id;
 return `<div class="row" style="cursor:pointer" data-act="exOpen" data-id="${o.id}"><span class="pill ${tone} mono" style="min-width:52px;justify-content:center">${sc} ${g}</span><div class="grow"><div class="t">${esc(o.name)}${o.live?' <span class="pill ok">Live logs</span>':''}</div><div class="s">${esc(o.type)} · ${esc(o.area)} · ${distKm(o).toFixed(1)} km · ${o.veg?'Pure veg':'Veg and non-veg'}</div>
  ${exp&&!o.live?`<div class="small" style="margin-top:6px">${open?`<b style="color:var(--warn)">${open} open complaint${open>1?'s':''}</b> · `:'No open complaints · '}Last inspection: ${insp?`${esc(insp.result)}, ${fmtDate(insp.date)}`:'none on record'}</div>`:''}</div>${o.live?`<button class="btn sm primary" data-go="guest">View kitchen</button>`:''}</div>`}).join('')||'<div class="empty">No outlets match. Try a different search.</div>'}
after.explore=()=>{const q=$('#exQ');q.addEventListener('input',()=>{S.exploreQ=q.value;$('#exList').innerHTML=exploreList();drawExplore()});$('#exSort').onchange=e=>{S.exploreSort=e.target.value;$('#exList').innerHTML=exploreList()};
 if(S.exploreMode==='map'){const m=makeMap('exMap',S.me||[18.5600,73.8300],12);if(m){m._hq=L.layerGroup().addTo(m);drawExplore()}else $('#exMap').outerHTML='<div class="empty">The map could not load. Check your internet connection; the list below still works.</div>'}};
function exploreFiltered(){const q=S.exploreQ.toLowerCase();return S.outlets.filter(o=>(!S.exploreVeg||o.veg)&&(!q||(o.name+' '+o.area+' '+o.type).toLowerCase().includes(q)))}
function drawExplore(){const m=MAPS.exMap;if(!m)return;m._hq.clearLayers();const pts=[];
 if(S.me){L.marker(S.me,{icon:L.divIcon({className:'mk me',html:'You',iconSize:[34,34]})}).addTo(m._hq);pts.push(S.me)}
 exploreFiltered().forEach(o=>{const sc=outletScore(o);const tone=sc>=70?'ok':sc>=55?'warn':'bad';const open=S.complaints.filter(c=>c.place===o.name&&c.status!=='resolved').length;
  L.marker(o.ll,{icon:L.divIcon({className:`mk ${tone}${o.live?' live':''}`,html:String(sc),iconSize:[32,32]}),title:o.name,keyboard:true}).bindPopup(`<b>${esc(o.name)}</b><p class="small muted">${esc(o.type)} · ${esc(o.area)} · ${distKm(o).toFixed(1)} km</p><p>Hygiene score <b>${sc}</b> · grade ${grade(sc)[0]}</p><p class="small">${open?`<span style="color:var(--warn)">${open} open complaint${open>1?'s':''}</span>`:'No open complaints'} · ${o.veg?'Pure veg':'Veg and non-veg'}</p>${o.live?'<button class="btn sm primary" data-go="guest" style="margin-top:6px">View kitchen live</button>':''}`).addTo(m._hq);pts.push(o.ll)});
 if(pts.length>1)m.fitBounds(pts,{padding:[36,36],maxZoom:14,animate:false});else if(pts.length)m.setView(pts[0],14,{animate:false})}

function dishClass(m){const hit=m.alg.filter(a=>S.profile.includes(a));const may=m.may.filter(a=>S.profile.includes(a));return hit.length?['bad','Contains '+hit.map(a=>ALG[a]).join(', '),'Avoid']:may.length?['warn','May contain '+may.map(a=>ALG[a]).join(', ')+' (shared kitchen)','Ask staff']:['ok',m.ing,'Safe for you']}
V.guest=()=>{const sc=score();const[,word,tone]=grade(sc);const feed=S.checklist.filter(t=>t.done).sort((a,b)=>b.doneAt-a.doneAt).slice(0,8);const trained=S.staff.filter(s=>s.badges.length).length;const last=S.aiChecks[0];const lastClean=S.checklist.filter(t=>t.sec==='cleaning'&&t.done).sort((a,b)=>b.doneAt-a.doneAt)[0];
 const shown=S.menu.filter(m=>!(S.hideUnsafe&&dishClass(m)[0]==='bad'));const hidden=S.menu.length-shown.length;
 return `<div class="card" style="flex-direction:row;align-items:center;gap:16px;flex-wrap:wrap;background:var(--brand-soft);border-color:transparent"><div class="qr" aria-hidden="true">${qrCells()}</div><div style="flex:1;min-width:200px"><span class="label">You scanned the counter QR at</span><h1>${esc(KITCHEN.name)}</h1><p class="muted">${esc(KITCHEN.area)}, Pune · FSSAI licensed · last inspection Pass</p></div>${ring(sc,104)}</div>
 ${S.sensors.some(s=>!inRange(s))?`<div class="alert warn">${ic('thermo')}<div><b>The kitchen is fixing a temperature problem</b><p class="small">${S.sensors.filter(s=>!inRange(s)).map(s=>esc(s.name)).join(', ')} is outside its safe range. Food from that unit is being moved.</p></div></div>`:''}
 <div class="grid g4">${[['Hygiene score',`${sc}`,word],['Staff trained',`${trained}/${S.staff.length}`,'food-safety badges'],['Last cleaning',lastClean?hhmm(lastClean.doneAt):'—',lastClean?esc(lastClean.task.split(' ').slice(0,3).join(' ')):''],['AI photo check',last?(last.issues.filter(i=>!i.fixed).length?'Issues open':'Clear'):'—',last?rel(last.at):'']].map(([l,v,s])=>`<div class="card stat" style="gap:2px"><span class="label">${l}</span><b style="font-size:1.4rem">${v}</b><span>${s}</span></div>`).join('')}</div>
 <div class="grid g2">
  <div class="card"><div class="card-h"><h3>Kitchen live, today</h3><span class="pill ${tone}">${word}</span></div><p class="small muted">Real check-ins from the kitchen with time stamps.</p><div class="list">
   ${S.sensors.map(s=>`<div class="row"><span class="time">now</span><div class="grow small">${esc(s.name)} at <span class="mono">${cur(s)}°C</span></div><span class="pill ${inRange(s)?'ok':'warn'}">${inRange(s)?'Safe':'Being fixed'}</span></div>`).join('')}
   ${feed.map(t=>`<div class="row"><span class="time">${hhmm(t.doneAt)}</span>${t.photo?`<img class="thumb" src="${t.photo}" alt="">`:''}<div class="grow small">${esc(t.task)}</div>${t.ai?.pass?'<span class="pill ok">Photo</span>':'<span class="pill neutral">Logged</span>'}</div>`).join('')}
  </div></div>
  <div class="card" id="allergyCard"><div class="card-h"><h3>Allergy guard</h3><span class="small muted">Saved on this phone</span></div><p class="small muted">Pick your allergies. Red means it contains them, amber means a cross-contact risk in a shared kitchen.</p>
   <div class="chips">${Object.entries(ALG).map(([k,l])=>`<button class="chip" aria-pressed="${S.profile.includes(k)}" data-act="toggleAlg" data-k="${k}">${l}</button>`).join('')}</div>
   <label class="small" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="hideUnsafe" ${S.hideUnsafe?'checked':''}> Hide dishes I can't eat${hidden?` <span class="pill neutral">${hidden} hidden</span>`:''}</label>
   <div class="list">${shown.map(m=>{const[t,why,lbl]=dishClass(m);return `<div class="row"><span class="stripe ${t}"></span><div class="grow"><div class="t" style="${t==='bad'?'color:var(--muted);text-decoration:line-through':''}">${esc(m.name)}</div><div class="s">${esc(why)}</div></div><span class="mono small">₹${m.price}</span><span class="pill ${t}">${lbl}</span></div>`}).join('')}</div>
   <button class="btn sm" data-act="openChat" data-q="Based on my allergies, what is safe for me to eat here?" style="align-self:flex-start">${ic('spark')}Ask HygiQ AI what to eat</button></div>
 </div>`};
after.guest=()=>{$('#hideUnsafe').onchange=e=>{S.hideUnsafe=e.target.checked;store.set('hide',S.hideUnsafe);render()}};

V.complain=()=>`<div class="pagehead"><div><span class="label">${esc(KITCHEN.name)}</span><h1>Report a problem</h1><p>Tell us what happened in your own words, in any language. HygiQ AI picks out the dish, symptoms and urgency and alerts the kitchen. Serious cases also reach the food safety officer.</p></div></div>
 <div class="grid g2"><div class="card">
  <div class="field"><label class="label" for="cText">What happened?</label><textarea id="cText" placeholder="e.g. Ate the paneer butter masala at lunch, now stomach pain and vomiting"></textarea></div>
  ${drop('complaint','Add a photo (optional)','Foreign object, packaging, or the dish')}
  <button class="btn primary" data-act="submitComplaint" style="align-self:flex-start">${ic('spark')}Send report</button></div>

 return `<div class="pagehead"><div><span class="label">Home kitchen</span><h1>My fridge</h1><p>Scan a label or add items by hand. HygiQ AI reminds you before things go off and suggests what to cook with them.</p></div><button class="btn primary" data-act="homeRecipe">${ic('spark')}Cook before it expires</button></div>
 <div id="recipeOut"></div>
 <div class="grid g2 wide" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)">

   <hr style="border:0;border-top:1px solid var(--line);width:100%"><h3>Family allergies</h3><div class="list">${S.family.map(f=>`<div class="row"><div class="grow t">${esc(f.name)}</div><div class="chips">${f.alg.map(a=>`<span class="pill accent">${ALG[a]}</span>`).join('')||'<span class="pill neutral">None</span>'}</div></div>`).join('')}</div></div>

 <div class="grid g2">

V.map=()=>{const al=alerts();const byArea={};S.complaints.forEach(c=>{(byArea[c.area]=byArea[c.area]||[]).push(c)});const maxN=Math.max(...Object.values(byArea).map(a=>a.length));
 return `<div class="pagehead"><div><span class="label">Food safety officer · Pune</span><h1>City watch</h1><p>Complaints from every kitchen on HygiQ, grouped by place, area and supplier to catch outbreaks early.</p></div></div>
 <div class="grid g4">${[['Open reports',S.complaints.filter(c=>c.status==='open').length],['Illness, last 48 h',S.complaints.filter(c=>c.cat==='Illness'&&c.hrs<=48).length],['Outbreak alerts',al.length],['Recalls issued',S.recalls.length]].map(([l,v])=>`<div class="card stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
 ${al.map(a=>`<div class="alert">${ic('warn')}<div style="flex:1;min-width:0"><b>${esc(a.title)}</b><p class="small">${esc(a.body)}</p></div>${a.outlet?`<button class="btn sm" data-act="urgentInsp" data-o="${esc(a.outlet)}">Schedule urgent inspection</button>`:`<button class="btn sm" data-act="supplierAlert" data-s="${esc(a.supplier||'')}">Alert its kitchens</button>`}</div>`).join('')}
 ${S.recalls.map(r=>`<div class="alert warn">${ic('siren')}<div><b>Recall from ${esc(KITCHEN.name)}: ${esc(r.item)} (${esc(r.batch)})</b><p class="small">${esc(r.reason)} · ${r.outlets} kitchens notified · ${rel(r.at)}</p></div></div>`).join('')}
 <div class="grid g2 wide" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)">
  <div class="card">${window.L?`<div class="card-h"><h3>Outbreak map</h3><div class="chips">${[['outlets','Outlets'],['complaints','Complaints'],['links','Supplier links']].map(([k,l])=>`<button class="chip f" aria-pressed="${S.layers[k]}" data-act="layer" data-k="${k}">${l}</button>`).join('')}</div></div>
   <div class="mapwrap"><div id="cityMap" class="mapbox" role="application" aria-label="Outbreak map of Pune"></div></div>
   <div class="legend"><span><i style="background:var(--bad)"></i>High risk / 2+ illness reports</span><span><i style="background:var(--warn)"></i>Medium / other reports</span><span><i style="background:var(--ok)"></i>Low</span><span><i style="background:var(--ink);border-radius:2px"></i>Supplier depot</span><span>Red line: supplier linked to complaints · amber dashed: kitchens it also supplies</span></div>`:`<div class="card-h"><h3>Complaint heatmap</h3><span class="small muted">Schematic, not to scale</span></div><div class="map-wrap"><svg class="map" viewBox="0 0 640 360" role="img" aria-label="Complaints by area in Pune">
   <path d="M20 230 C120 200 200 240 300 215 S470 170 620 225" fill="none" stroke="var(--brand-soft)" stroke-width="16" stroke-linecap="round"/><text x="560" y="250" class="sub">Mula-Mutha river</text>
   ${Object.entries(AREAS).map(([a,[x,y]])=>{const list=byArea[a]||[];const n=list.length;const ill=list.filter(c=>c.cat==='Illness'&&c.hrs<=48).length;const tone=ill>=2?'bad':n?'warn':'ok';const r=10+(n/maxN)*26;return `<g class="area" data-act="area" data-a="${a}" tabindex="0" role="button" aria-label="${a}: ${n} reports"><circle class="halo" cx="${x}" cy="${y}" r="${r+10}" fill="var(--${tone})" opacity=".18"/><circle cx="${x}" cy="${y}" r="${r}" fill="var(--${tone})" opacity=".85"/><text x="${x}" y="${y+4}" text-anchor="middle" style="fill:#fff;font-family:var(--f-mono);font-size:12px">${n}</text><text x="${x}" y="${y+r+16}" text-anchor="middle">${a}</text></g>`}).join('')}
  </svg></div><div class="chips small"><span class="pill bad">2+ illness reports in 48 h</span><span class="pill warn">Other reports</span><span class="pill ok">None</span></div>`}</div>
  <div class="card"><div class="card-h"><h3 id="areaTitle">Complaint feed</h3><button class="btn sm ghost" data-act="area" data-a="">Show all</button></div><div class="list" id="areaList">${areaList('')}</div></div>
 </div>`};
after.map=()=>{const m=makeMap('cityMap',[18.5560,73.8400],12);if(!m)return;m._hq=L.layerGroup().addTo(m);drawCity();m.fitBounds([...S.outlets.map(o=>o.ll),...Object.values(DEPOTS)],{padding:[30,30],animate:false})};
function drawCity(){const m=MAPS.cityMap;if(!m)return;m._hq.clearLayers();const g=m._hq;
 const byArea={};S.complaints.forEach(c=>{(byArea[c.area]=byArea[c.area]||[]).push(c)});
 if(S.layers.complaints)Object.entries(byArea).forEach(([a,list])=>{const ll=AREA_LL[a];if(!ll)return;const open=list.filter(c=>c.status!=='resolved');const ill=list.filter(c=>c.cat==='Illness'&&c.hrs<=48).length;const tone=ill>=2?'bad':open.length?'warn':'ok';
  L.circle(ll,{radius:500+list.length*380,className:'z-'+tone,weight:1,fillOpacity:.22}).bindTooltip(`${a}: ${list.length} report${list.length>1?'s':''}, ${open.length} open`,{sticky:true}).on('click',()=>{$('#areaTitle').textContent=`Reports in ${a}`;$('#areaList').innerHTML=areaList(a)}).addTo(g)});
 if(S.layers.links)alerts().filter(a=>a.supplier&&DEPOTS[a.supplier]).forEach(a=>{const d=DEPOTS[a.supplier];const hit=new Set(S.complaints.filter(c=>c.supplier===a.supplier&&c.hrs<=48).map(c=>c.place));
  L.marker(d,{icon:L.divIcon({className:'mk depot',html:'D',iconSize:[26,26]}),title:a.supplier}).bindPopup(`<b>${esc(a.supplier)}</b><p class="small muted">Supplier depot</p><p class="small">${hit.size} kitchens with complaints · supplies ${S.outlets.filter(o=>o.sup.includes(a.supplier)).length} kitchens in total</p><button class="btn sm" data-act="supplierAlert" data-s="${esc(a.supplier)}" style="margin-top:6px">Alert its kitchens</button>`).addTo(g);
  S.outlets.filter(o=>o.sup.includes(a.supplier)).forEach(o=>L.polyline([d,o.ll],{className:'lf-link'+(hit.has(o.name)?'':' risk'),weight:hit.has(o.name)?3:2,dashArray:hit.has(o.name)?null:'6 6',opacity:.85}).bindTooltip(hit.has(o.name)?`${o.name}: complaint linked to ${a.supplier}`:`${o.name}: also supplied, at risk`,{sticky:true}).addTo(g))});
 if(S.layers.outlets)S.outlets.forEach(o=>{const rk=risk(o);L.marker(o.ll,{icon:L.divIcon({className:`mk ${rk.tone}${o.live?' live':''}`,html:String(rk.r),iconSize:[32,32]}),title:o.name,keyboard:true}).bindPopup(`<b>${esc(o.name)}</b><p class="small muted">${esc(o.type)} · ${esc(o.area)}</p><p>${rk.level} risk <b>${rk.r}</b> · score ${outletScore(o)}</p><p class="small">${rk.open} open complaint${rk.open===1?'':'s'}</p><div class="chips" style="margin-top:6px"><button class="btn sm" data-act="openOutlet" data-id="${o.id}">Full history</button><button class="btn sm primary" data-act="urgentInsp" data-o="${esc(o.name)}">Urgent inspection</button></div>`).addTo(g)});
}
let AREA='';
function areaList(a){AREA=a;const l=S.complaints.filter(c=>!a||c.area===a).sort((x,y)=>x.hrs-y.hrs);return l.map(c=>`<div class="row" style="align-items:flex-start"><span class="stripe ${c.sev==='high'?'bad':c.sev==='medium'?'warn':''}"></span><div class="grow"><div class="t small">${esc(c.place)} · ${esc(c.dish)}</div><div class="s">${esc(c.cat)} · ${c.hrs<1?'just now':c.hrs+' h ago'}${c.supplier?' · '+esc(c.supplier):''}</div></div>${statusPill(c.status)}${c.status==='open'?`<button class="btn sm" data-act="cStatus" data-id="${c.id}" data-s="reviewed">Review</button>`:c.status==='reviewed'?`<button class="btn sm" data-act="cStatus" data-id="${c.id}" data-s="resolved">Resolve</button>`:''}</div>`).join('')||'<div class="empty">No reports here.</div>'}

V.outlets=()=>{const list=S.outlets.map(o=>({o,...risk(o)})).sort((a,b)=>b.r-a.r);const sel=S.outlets.find(o=>o.id===S.selOutlet)||list[0].o;
 return `<div class="pagehead"><div><span class="label">Risk model</span><h1>Outlets by risk</h1><p>Risk combines the hygiene score, open complaints and live problems such as warm fridges or expired stock. Inspect the top of this list first.</p></div></div>
 <div class="grid g2 wide" style="grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)">
  <div class="card"><div class="list">${list.map(({o,r,level,tone,open})=>`<div class="row" style="cursor:pointer;${o.id===sel.id?'background:var(--surface-2);border-radius:10px;padding-inline:8px':''}" data-act="selOutlet" data-id="${o.id}"><span class="stripe ${tone}"></span><div class="grow"><div class="t">${esc(o.name)}</div><div class="s">${esc(o.area)} · score ${outletScore(o)} · ${open} open complaint${open===1?'':'s'}</div></div><span class="pill ${tone}">${level} ${r}</span></div>`).join('')}</div></div>

 switch(best){
 case 'risk':{const l=ranked();const top=l[0];const al=alerts();
  return `**${top.o.name} (${top.o.area}) is the most concerning**: ${top.level.toLowerCase()} risk ${top.r}/100, hygiene score ${outletScore(top.o)}, ${top.open} open complaint${top.open===1?'':'s'}${top.hi?` (${top.hi} serious)`:''}.\n\n`+(al.length?'Active alerts:\n'+al.map(a=>`- **${a.title}**`).join('\n')+'\n\n':'')+'Inspect in this order:\n'+l.slice(0,4).map((x,i)=>`- ${i+1}. **${x.o.name}**: ${x.level} risk ${x.r}, score ${outletScore(x.o)}, ${x.open} open`).join('\n')+(S.role==='inspector'?'\n\n**Schedule an urgent inspection** from the alert or the outbreak map.':'')}
 case 'score':return `Your score is **${sc}/100** (grade ${grade(sc)[0]}). Every point comes from a log:\n`+breakdown().map(b=>`- **${b.k}** ${b.v.toFixed(0)}/${b.max}: ${b.why}`).join('\n')+`\n\nFastest gain: **${breakdown().sort((a,b)=>(a.v/a.max)-(b.v/b.max))[0].k.toLowerCase()}**.`;
 case 'recall':{const sd=S.inventory.filter(i=>i.supplier===KITCHEN.supplier);return `There is a city alert on **${KITCHEN.supplier}**. Your batches from them: ${sd.map(i=>`${i.name} ${i.batch}`).join(', ')||'none left'}. **Hold them and smell-check now**; if anything is sour, recall it from Stock & temps so other kitchens are warned.`}
 case 'expiry':{const l=(S.role==='home'?S.home:S.inventory).filter(i=>daysLeft(i.expiry)!==null&&daysLeft(i.expiry)<=2).sort((a,b)=>daysLeft(a.expiry)-daysLeft(b.expiry));return l.length?'Use or check these first:\n'+l.map(i=>`- **${i.name}**: ${daysLeft(i.expiry)<0?'expired, discard it':daysLeft(i.expiry)===0?'expires today, use it now':daysLeft(i.expiry)+' day'+(daysLeft(i.expiry)>1?'s':'')+' left'}`).join('\n'):'Nothing expires in the next two days.'}
 case 'allergy':{const fam=S.family.find(f=>t.includes(f.name.toLowerCase()));const said=Object.entries({dairy:/dairy|milk|lactose|paneer|दूध/,peanut:/peanut|groundnut|shengdana/,treenut:/tree ?nut|cashew|almond|kaju|badam/,gluten:/gluten|wheat|maida/,egg:/\begg/,fish:/\bfish/,sesame:/sesame|\btil\b/,soy:/\bsoy/,mustard:/mustard|\brai\b/,shellfish:/shellfish|prawn|shrimp|crab/}).filter(([,re])=>re.test(t)).map(([k])=>k);const p=said.length?said:fam?fam.alg:S.profile;const who=fam?fam.name:'you';
  if(S.role==='home'&&fam){const ok=S.home.filter(i=>daysLeft(i.expiry)>=0&&!(/milk|paneer|curd|dahi/i.test(i.name)&&p.includes('dairy')));return `${who} (${p.map(a=>ALG[a]).join(', ')||'no allergies'}) can have:\n${ok.map(i=>`- ${i.name}`).join('\n')}`}
  const ok=S.menu.filter(m=>!m.alg.some(a=>p.includes(a)));return `For ${who} (${p.map(a=>ALG[a]).join(', ')||'no allergies set'}), these don't contain your allergens:\n${ok.map(m=>`- ${m.name}${m.may.some(a=>p.includes(a))?' (may contain, ask staff)':''}`).join('\n')}\n\n**Tell the counter about your allergy** so they use a clean ladle.`}
 case 'safe':{const bad=S.sensors.filter(s=>!inRange(s));const done=S.checklist.filter(c=>c.done).length;return `**${KITCHEN.name} scores ${sc}/100 today (grade ${grade(sc)[0]}).** ${done} hygiene checks logged with times, last inspection was a Pass.`+(bad.length?`\n\nOne thing to know: ${bad.map(s=>`${s.name} is at ${cur(s)}°C`).join(', ')}, and the kitchen is fixing it.`:'\n\nAll fridges and hot-holding units are in their safe range.')}
 case 'near':return 'Best-rated outlets near you:\n'+S.outlets.map(o=>[o.name,outletScore(o),distKm(o).toFixed(1)]).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([n,s,d])=>`- **${n}**: ${s}/100, ${d} km`).join('\n')+'\n\nOpen **Explore** to see them on the map.';
 case 'cook':return S.role==='home'?`Use these soon:\n${S.home.filter(i=>daysLeft(i.expiry)>=0&&daysLeft(i.expiry)<=2).map(i=>`- ${i.name}`).join('\n')}\n\nTry **palak paneer** or **masala bread upma**. Tap "Cook before it expires" for full ideas.`:`Use the soonest-expiring stock:\n- **Paneer butter masala** for lunch (paneer, 1 day left)\n- **Surmai fry** special (fish, 1 day left)\n- **Kadhi** with today's curd\n\nDiscard the expired milk, and list leftover pulao for donation tonight.`;
 case 'temp':{const b=S.sensors.filter(s=>!inRange(s));return b.length?b.map(s=>`**${s.name} is at ${cur(s)}°C**, outside ${RANGES[s.type].min} to ${RANGES[s.type].max}°C. Move food out and call for repair.`).join('\n'):'All four units are in their safe range: '+S.sensors.map(s=>`${s.name} ${cur(s)}°C`).join(', ')+'.'}
 case 'rice':return 'Cooked food should not stay between 5 and 60°C for more than **2 hours**. Rice is risky: Bacillus cereus spores survive cooking. **Chill it within 2 hours or discard it**, and reheat to 75°C before serving.';
 case 'training':{const b=S.staff.reduce((a,s)=>a+s.badges.length,0);return `${b} of ${S.staff.length*QUIZZES.length} training badges earned.\n`+S.staff.map(s=>`- **${s.name}**: ${s.badges.length?s.badges.map(x=>QUIZZES.find(q=>q.id===x).badge).join(', '):'no badges yet'}`).join('\n')+'\n\nEach badge adds to the score. **Start with the allergen quiz** in Team training.'}
 case 'complaint':{const c=(S.role==='inspector'?S.complaints:ours()).filter(x=>x.status!=='resolved').sort((a,b)=>({high:0,medium:1,low:2})[a.sev]-({high:0,medium:1,low:2})[b.sev]);return c.length?`${c.length} open complaint${c.length>1?'s':''}, most serious first:\n`+c.slice(0,5).map(x=>`- **${x.place}, ${x.dish}**: ${x.cat} (${x.sev}), ${x.hrs} h ago`).join('\n'):'No open complaints.'}
 case 'surplus':return `Near-expiry food you can donate tonight: ${S.inventory.filter(i=>daysLeft(i.expiry)>=0&&daysLeft(i.expiry)<=1).map(i=>i.name).join(', ')||'none'}. **List it in Stock & temps → Surplus food**; ${S.surplus.filter(x=>x.mode==='donate').length} donation${S.surplus.length===1?'':'s'} so far.`;
 default:{const od=due().filter(x=>!x.done);const bad=S.sensors.filter(s=>!inRange(s));const exp=S.inventory.filter(i=>daysLeft(i.expiry)<0);return `Score is **${sc}/100**. Do these first:\n`+[...bad.map(s=>`- Fix ${s.name} (${cur(s)}°C)`),...exp.map(i=>`- Discard expired ${i.name}`),...od.map(x=>`- ${x.task}`)].join('\n')||'Everything due is done.'}
 }}
async function send(q,{voice=false}={}){openPanel();stopSpeaking();const img=chatImg;bubble('u',(img?`<img src="${URL.createObjectURL(img)}" alt="">`:'')+esc(q));chatImg=null;$('#attachPrev').hidden=true;$('#chatFile').value='';
 turns.push({role:'user',content:q+(img?' [photo attached]':'')});renderSuggest();const a=bubble('a','<span class="muted">Thinking…</span>');$('#sendBtn').disabled=true;
 const fallback=()=>md(demoReply(q))+(img?'<p class="demo-tag">Photo noted. Live photo analysis needs Claude connected.</p>':'')+'<p class="demo-tag">Demo answer from app data. For live AI, run node server.js with an AI key or open the Claude link.</p>';
 if(!SAMPLE&&SERVER){try{const text=await callServer({system:rules(),messages:turns.slice(-10),images:img?[img]:[]});a.innerHTML=md(text);turns.push({role:'assistant',content:text});if(voice||SPEAK)speak(text)}catch(e){a.innerHTML=`<p class="demo-tag">${esc(e.message)}</p>`;turns.pop()}$('#msgs').scrollTop=1e9;$('#sendBtn').disabled=false;return}
 if(!SAMPLE){await new Promise(r=>setTimeout(r,600));a.innerHTML=fallback();turns.push({role:'assistant',content:demoReply(q)});$('#sendBtn').disabled=false;if(voice||SPEAK)speak(demoReply(q),'English');return}
 ctl=new AbortController();
 try{const{text}=await SAMPLE([{role:'user',content:rules()},...turns.slice(-10)],{cache:false,signal:ctl.signal,images:img&&CAN_IMG?[img]:undefined,onText:({text})=>{a.innerHTML=md(text);$('#msgs').scrollTop=1e9}});turns.push({role:'assistant',content:text});if(voice||SPEAK)speak(text)}
 catch(e){const m=aiErr(e);if(m===null){a.innerHTML=fallback();turns.push({role:'assistant',content:demoReply(q)});if(voice||SPEAK)speak(demoReply(q),'English')}else{a.innerHTML=(e.text?md(e.text):'')+`<p class="demo-tag">${esc(m)}</p>`;turns.pop()}}
 $('#sendBtn').disabled=false}

/* ================= voice: speech in, speech out ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const LANGCODE={English:'en-IN',Hindi:'hi-IN',Marathi:'mr-IN'};
let SPEAK=store.get('speak',false),REC=null;
function speakIcon(){const b=$('#speakBtn');b.innerHTML=ic(SPEAK?'speaker':'mute');b.setAttribute('aria-pressed',SPEAK)}
const plain=t=>t.replace(/\*\*|__|_|#+\s|`/g,'').replace(/^\s*[-*•]\s+/gm,'').replace(/\n+/g,'. ');
function speak(text,lang=S.lang){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(plain(text).slice(0,900));u.lang=LANGCODE[lang]||'en-IN';const v=speechSynthesis.getVoices().find(v=>v.lang===u.lang)||speechSynthesis.getVoices().find(v=>v.lang.startsWith(u.lang.slice(0,2)));if(v)u.voice=v;u.rate=1;speechSynthesis.speak(u)}catch{}}
function stopSpeaking(){try{speechSynthesis?.cancel()}catch{}}
function listen({onPartial,onFinal,btn}){
 if(!SR){toast('Voice input needs Chrome or Edge. Type instead, or open the localhost version in Chrome.');return}
 if(REC){REC.stop();return}
 stopSpeaking();const r=new SR();REC=r;r.lang=LANGCODE[S.lang]||'en-IN';r.interimResults=true;r.maxAlternatives=1;let final='';
 btn?.classList.add('rec');
 r.onresult=e=>{let t='';for(const res of e.results){t+=res[0].transcript}final=t;onPartial?.(t)};
 r.onerror=e=>{const m={'not-allowed':'Microphone is blocked here. In the Claude viewer, use typing; voice works in the localhost version in Chrome.','service-not-allowed':'Microphone is blocked here. Voice works in the localhost version in Chrome.','no-speech':'Didn\'t hear anything. Tap the mic and speak.','network':'Voice recognition needs an internet connection.','audio-capture':'No microphone found.'}[e.error];if(m)toast(m)};
 r.onend=()=>{REC=null;btn?.classList.remove('rec');if(final.trim())onFinal?.(final.trim())};
 try{r.start()}catch{REC=null;btn?.classList.remove('rec');toast('Could not start the microphone.')}}
$('#micBtn').innerHTML=ic('mic');speakIcon();
$('#speakBtn').onclick=()=>{SPEAK=!SPEAK;store.set('speak',SPEAK);speakIcon();if(!SPEAK)stopSpeaking();toast(SPEAK?'Replies will be read aloud':'Read-aloud off')};
$('#micBtn').onclick=()=>{const hint=$('#voiceHint');listen({btn:$('#micBtn'),onPartial:t=>{$('#chatIn').value=t;hint.hidden=false;hint.textContent=`Listening in ${S.lang}… tap the mic again to stop`},onFinal:t=>{hint.hidden=true;$('#chatIn').value='';send(t,{voice:true})}});if(REC){const hint2=$('#voiceHint');hint2.hidden=false;hint2.textContent=`Listening in ${S.lang}…`}else $('#voiceHint').hidden=true};
if('speechSynthesis' in window)try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch{}
function parseDelivery(t){const s=t.toLowerCase();const qm=s.match(/(\d+(?:\.\d+)?)\s*(kg|kilo|kilogram|g|gram|l|litre|liter|ltr|pcs|pieces|packet|dozen)/);
 const units={kilo:'kg',kilogram:'kg',gram:'g',litre:'L',liter:'L',ltr:'L',l:'L',pieces:'pcs',packet:'packets'};const qty=qm?`${qm[1]} ${units[qm[2]]||qm[2]}`:'';
 let expiry=iso(3);const dm=s.match(/(\d{1,2})\s*(?:tareekh|tarikh|tarik|tarakh|ta\.|th|st|nd|rd|date)/);if(dm){const d=+dm[1];const x=new Date(TODAY);if(d<x.getDate())x.setMonth(x.getMonth()+1);x.setDate(d);expiry=ymd(x)}
 else{const nm=s.match(/(\d+)\s*(?:din|days|divas)/);if(nm)expiry=iso(+nm[1])}
 const sup=S.inventory.map(i=>i.supplier).find(x=>s.includes(x.toLowerCase().split(' ')[0]))||'Logged by voice';
 const name=(t.split(/[,.]/)[0].replace(/\d+(\.\d+)?\s*(kg|kilo\w*|g|gram|l|litre|liter|ltr|pcs|pieces|packet|dozen)?/i,'').replace(/\b(aaya|aaye|aali|aala|arrived|came|aa gaya)\b/gi,'').trim())||'New item';
 const lower=name.toLowerCase();const alg=[];if(/paneer|milk|curd|dahi|butter|ghee|cream|dudh/.test(lower))alg.push('dairy');if(/egg|anda/.test(lower))alg.push('egg');if(/fish|surmai|pomfret|machli/.test(lower))alg.push('fish');if(/peanut|groundnut|shengdana/.test(lower))alg.push('peanut');if(/maida|atta|bread|pav|rava/.test(lower))alg.push('gluten');
 return{items:[{name:name[0].toUpperCase()+name.slice(1),qty,expiry,storage:alg.includes('dairy')?'Dairy fridge':/dal|rice|atta|besan|flour/.test(lower)?'Dry store':'Walk-in chiller',supplier:sup,allergens:alg}]}}
Object.assign(ACT,{
 voiceLogMic:()=>listen({btn:$('#vlMic'),onPartial:t=>$('#vlText').value=t,onFinal:t=>{$('#vlText').value=t;ACT.voiceLogGo()}}),
 async voiceLogGo(){const t=$('#vlText').value.trim();if(!t)return toast('Say or type what arrived first');const out=$('#vlOut');out.innerHTML='<p class="small muted">Understanding…</p>';
  try{const r=await askJSON(`A kitchen worker in Pune logged a stock delivery by voice. It may be in English, Hindi, Marathi or a mix, transcribed by speech recognition so spelling may be rough: "${t}". Today is ${ymd(TODAY)}. Extract every item. Dates like "28 tareekh" mean the 28th of this month (next month if already past). If no expiry is said, use null. Storage is one of: Dairy fridge, Walk-in chiller, Freezer, Dry store, Veg rack. Known suppliers: ${[...new Set(S.inventory.map(i=>i.supplier))].join(', ')}. Allergen keys: ${Object.keys(ALG).join(', ')}. Reply with only JSON: {"items":[{"name":string in English,"qty":string,"expiry":"YYYY-MM-DD"|null,"storage":string,"supplier":string|null,"allergens":[keys]}],"confirm":"one short sentence confirming what was logged, in the same language the worker used"}`,{tier:'quick',fallback:()=>({...parseDelivery(t),confirm:''})});
   const added=(r.items||[]).map(i=>({id:uid(),batch:'VL-'+String(Math.floor(Math.random()*9000)+1000),name:String(i.name||'New item'),qty:String(i.qty||''),storage:i.storage||'Walk-in chiller',supplier:i.supplier||'Logged by voice',arrived:iso(0),expiry:i.expiry||null,alg:(i.allergens||[]).filter(a=>ALG[a])}));
   S.inventory.push(...added);const msg=r.confirm||`Added ${added.map(i=>i.name+(i.qty?' ('+i.qty+')':'')).join(', ')} to stock.`;
   render();$('#vlOut').innerHTML=`<div class="result"><div><span class="pill ok">Added to stock</span></div><div class="small">${esc(msg)}</div><div class="list">${added.map(i=>`<div class="row"><div class="grow"><div class="t small">${esc(i.name)} · ${esc(i.qty)}</div><div class="s">${esc(i.storage)} · ${esc(i.supplier)}</div></div>${expPill(i.expiry)}</div>`).join('')}</div>${demoNote(r)}</div>`;$('#voiceLogCard').scrollIntoView({behavior:'smooth',block:'center'});
   if(SPEAK||r.confirm)speak(msg)}catch(e){out.innerHTML='';toast(e.message)}}
});

$('#logo1').innerHTML=LOGO(34);$('#logo2').innerHTML=LOGO(26);$('#logo3').innerHTML=LOGO(30);

render();renderSuggest();
